[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stablecoin-amount-tools"
version = "0.1.0"
description = "Exact decimal token amount and base-unit conversion without floats"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Aijaz"}]

[tool.setuptools]
py-modules = ["stablecoin_amounts"]
